<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  onload="Zotero.MetadataLinter?.initializePreferences(document)"
  onshowing="Zotero.MetadataLinter?.refreshPreferences(document)"
>
  <vbox class="main-section">
    <description id="ml-settings-help"></description>
    <checkbox native="true" id="ml-replace-publication" />
    <hbox align="center">
      <label id="ml-publication-label" control="ml-publication-style"></label>
      <menulist native="true" id="ml-publication-style">
        <menupopup>
          <menuitem id="ml-retrieved-names" value="original"></menuitem>
          <menuitem id="ml-standard-names" value="standard"></menuitem>
          <menuitem id="ml-short-names" value="short"></menuitem>
        </menupopup>
      </menulist>
    </hbox>
    <description id="ml-publication-help"></description>
  </vbox>
</vbox>
